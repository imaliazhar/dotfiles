# Symlinks created by scripts/setup-symlinks.sh
# <source relative to the repo> -> <destination>

config -> ~/.config
bin -> ~/.local/bin
config/zsh/zshenv -> ~/.zshenv
config/theme/theme -> ~/.local/bin/theme
config/aerospace/monitor -> ~/.local/bin/monitor

config/claude/settings.json -> ~/.claude/settings.json
config/claude/statusline-command.sh -> ~/.claude/statusline-command.sh

config/alfred/Alfred.alfredpreferences -> ~/Library/Application Support/Alfred/Alfred.alfredpreferences

launchd/slack/com.user.slack-close.plist -> ~/Library/LaunchAgents/com.user.slack-close.plist
launchd/slack/com.user.slack-open.plist -> ~/Library/LaunchAgents/com.user.slack-open.plist
